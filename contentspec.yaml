version: 2.0

defaultLocaleCode: en-US
localeCodes:
  - en-US

awsAccountConfig:
  accountSources:
    - WorkshopStudio
  serviceLinkedRoles: 
    - spot.amazonaws.com
    - spotfleet.amazonaws.com
    - eks.amazonaws.com
    - eks-nodegroup.amazonaws.com
    - fsx.amazonaws.com
    - ssm.amazonaws.com
    - autoscaling.amazonaws.com
  ec2KeyPair: true
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    deployableRegions:
      optional:
        - us-west-2
        - ap-southeast-2
        - eu-west-1
    accessibleRegions:
      required:
        - us-west-2
  participantRole:
    managedPolicies:
      - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
      - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      - "arn:aws:iam::aws:policy/ReadOnlyAccess"
    iamPolicies:
      - static/participant_policy.json

infrastructure:
  cloudformationTemplates:
    - templateLocation: static/GenAIFSXWorkshopOnEKS.yaml
      label: GenAI FSx workshop
      parameters:
        - templateParameter: Assets
          defaultValue: "s3://{{.AssetsBucketName}}/{{.AssetsBucketPrefix}}"
      participantVisibleStackOutputs:
        - URL
        - Password