apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-b-phi2-healthcare
  namespace: model-healthcare
  labels:
    app: model-b-healthcare
    data-domain: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-b-healthcare
  template:
    metadata:
      labels:
        app: model-b-healthcare
        data-domain: healthcare
    spec:
      serviceAccountName: healthcare-model-sa
      nodeSelector:
        node.kubernetes.io/instance-type: inf2.xlarge
      tolerations:
      - key: "aws.amazon.com/neuron"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: inference-server
        image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.9.1-neuronx-py311-sdk2.26.1-ubuntu22.04
        command: ["vllm", "serve"]
        args:
        - /model-dir/Phi-2
        - --served-model-name=phi2-healthcare
        - --tensor-parallel-size=2
        - --max-model-len=2048
        - --max-num-seqs=4
        - --device=neuron
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            aws.amazon.com/neuroncore: 2
          limits:
            aws.amazon.com/neuroncore: 2
        env:
        - name: NEURON_COMPILED_ARTIFACTS
          value: /model-dir/Phi-2
        volumeMounts:
        - name: model-storage
          mountPath: "/model-dir"
          readOnly: true
        - name: domain-data
          mountPath: "/data"
          readOnly: true
        ports:
        - containerPort: 8000
          name: http
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: healthcare-model-claim
      - name: domain-data
        persistentVolumeClaim:
          claimName: healthcare-data-claim
---
apiVersion: v1
kind: Service
metadata:
  name: model-b-healthcare-svc
  namespace: model-healthcare
spec:
  selector:
    app: model-b-healthcare
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
