apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-nas-segregated
provisioner: csi.trident.netapp.io
reclaimPolicy: Retain
parameters:
  backendType: "ontap-nas"
  provisioningType: "thin"
  snapshots: "true"
  # Export policy ensures only designated pods can mount this volume
  exportPolicy: "data-segregation-policy"
allowVolumeExpansion: false
mountOptions:
  - nfsvers=4.1
  - hard
  - rsize=65536
  - wsize=65536
