# =============================================================================
# Mistral-7B-Instruct-v0.3 — Deployment on inf2.xlarge with Pre-compiled Artifacts
# =============================================================================
#
# This manifest deploys Mistral-7B-Instruct-v0.3 on AWS Inferentia2 inf2.xlarge
# (16GB RAM, 2 NeuronCores) using pre-compiled Neuron artifacts stored on
# FSx for NetApp ONTAP. No on-the-fly compilation occurs at startup.
#
# WHY SDK 2.26.1?
#   Two independent blockers prevent newer DLC images from working on inf2.xlarge:
#
#   1. attention_cte NxDI runtime bug (SDK 2.29.0):
#      The NxDI runtime generates HLO patterns that trigger a DMA transpose
#      compiler error at seq_len=4096. Not a compiler bug — SDK 2.27.1 uses
#      the same compiler (neuronxcc 2.24.5133.0) without triggering it.
#
#   2. V1 engine memory overhead (vLLM 0.11.0+):
#      All V1 engine versions require ~14-14.5 GiB for Mistral-7B, exceeding
#      inf2.xlarge's usable ~15.2 GiB. Only vLLM 0.9.1 (V0 engine) fits at
#      ~9.75 GiB with 36% headroom.
#
# PRE-REQUISITES:
#   - Pre-compiled model directory on FSx for ONTAP at /work-dir/Mistral-7B-Instruct-v0.3
#     containing both model weights (safetensors) and compiled artifacts
#     (model.pt + neuron_config.json from SDK 2.26.1)
#   - FSx for ONTAP PVC named "ontap-model-claim" dynamically provisioned via Trident
#   - Replace FSX_ONTAP_AZ below with your FSx ONTAP availability zone
#
# STARTUP TIMING (from production logs):
#   - Image pull (first time): ~5m 12s (10.5 GB DLC image)
#   - vLLM init + weight loading: ~1m 40s
#   - Warmup: ~3s
#   - Total cold start: ~7m | Warm restart (image cached): ~2m
#
# PROBE DESIGN:
#   initialDelaySeconds=60 — start probing after 1 min; early failures are expected
#   and absorbed by failureThreshold. Pod flips Ready the instant /health responds.
#   Liveness:  60s + (36 × 15s) = 600s (10m) — covers cold start + margin.
#   Readiness: 60s + (54 × 10s) = 600s (10m) — same window, faster polling.
#
# STARTUP: ~2 minutes (warm) / ~7 minutes (cold, first image pull)
# MEMORY:  ~9.75 GiB used / ~15.2 GiB available (36% headroom)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mistral-inf2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mistral-inf2-server
  template:
    metadata:
      labels:
        app: vllm-mistral-inf2-server
    spec:
      schedulerName: my-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - FSX_ONTAP_AZ # Replace with your FSx ONTAP AZ
      nodeSelector:
        node.kubernetes.io/instance-type: inf2.xlarge
      tolerations:
        - key: "aws.amazon.com/neuron"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-server
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.9.1-neuronx-py311-sdk2.26.1-ubuntu22.04
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          command: ["vllm", "serve"]
          args:
            - /work-dir/Mistral-7B-Instruct-v0.3
            - --served-model-name=mistral-7b-neuron
            - --trust-remote-code
            # Neuron-specific
            - --tensor-parallel-size=2
            - --max-model-len=4096
            - --max-num-seqs=4
            - --device=neuron
          env:
            - name: NEURON_COMPILED_ARTIFACTS
              value: /work-dir/Mistral-7B-Instruct-v0.3
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 36
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 54
            successThreshold: 1
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              aws.amazon.com/neuroncore: 2
            limits:
              aws.amazon.com/neuroncore: 2
          volumeMounts:
            - name: persistent-storage
              mountPath: /work-dir
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: ontap-model-claim
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mistral7b-service
  labels:
    app: vllm-mistral-inf2-server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: vllm-mistral-inf2-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
