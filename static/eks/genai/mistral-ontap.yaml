apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mistral-inf2-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mistral-inf2-server
  template:
    metadata:
      labels:
        app: vllm-mistral-inf2-server
    spec:
      schedulerName: my-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - FSX_ONTAP_AZ # Replace with your FSx ONTAP AZ
      nodeSelector:
        eks.amazonaws.com/instance-family: inf2
      tolerations:
        - key: "aws.amazon.com/neuron"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-server
          image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.16.0-neuronx-py312-sdk2.29.0-ubuntu24.04
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          command: ["vllm", "serve"]
          args:
            - /work-dir/Mistral-7B-Instruct-v0.3
            - --served-model-name=mistralai/Mistral-7B-Instruct-v0.3
            - --trust-remote-code
            # Mistral specific
            - --enable-auto-tool-choice
            - --tool-call-parser=mistral
            - --tokenizer-mode=mistral
            - --load-format=mistral
            - --config-format=mistral
            # Neuron specific
            - --tensor-parallel-size=2
            - --gpu-memory-utilization=0.95
            - --max-num-seqs=3
            - --max-model-len=8192
            - --no-enable-prefix-caching
          env:
            - name: NEURON_COMPILED_ARTIFACTS
              value: /work-dir/Mistral-7B-Instruct-v0.3
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 24
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              aws.amazon.com/neuroncore: 2
            limits:
              aws.amazon.com/neuroncore: 2
          volumeMounts:
            - name: persistent-storage
              mountPath: /work-dir
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: ontap-model-claim
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mistral7b-service
  labels:
    app: vllm-mistral-inf2-server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: vllm-mistral-inf2-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
