# ============================================================================
# Open WebUI Helm chart values for this workshop
# ----------------------------------------------------------------------------
# Chart: https://github.com/open-webui/helm-charts
# Repo:  https://helm.openwebui.com/
# ============================================================================

# ---- Image ----
image:
  repository: public.ecr.aws/parikshit/openwebui
  tag: latest-v0.9.1@sha256:4578b57bc950ac7f93d9e120a5ce243478521064c426d4e7ea8539a09dbc0453
  pullPolicy: IfNotPresent

# ---- Disable extras we don't need for this workshop ----
# We use vLLM (OpenAI-compatible) as the inference backend, not Ollama
ollama:
  enabled: false

# Open WebUI Pipelines not needed — we connect directly to vLLM
pipelines:
  enabled: false

# No websocket manager / Redis needed for a single-replica workshop deployment
websocket:
  enabled: false

# No persistence for the workshop — chat history is ephemeral
persistence:
  enabled: false

# ---- LiteLLM AI Gateway backend ----
# Connect via LiteLLM proxy which routes chat to self-hosted vLLM
# and tool-calling requests to Bedrock Claude Haiku 4.5
openaiBaseApiUrls:
  - "http://litellm-service:4000/v1"

# ---- Runtime environment ----
extraEnvVars:
  - name: WEBUI_AUTH
    value: "False"
  - name: ENABLE_EVALUATION_ARENA_MODELS
    value: "False"
  - name: OPENAI_API_KEY
    value: "not-needed"

# ---- Resources ----
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"

# ---- Node affinity: pin to x86_64 2xlarge instances ----
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node.kubernetes.io/instance-type
              operator: In
              values:
                - c5.2xlarge
                - c5d.2xlarge
                - c5n.2xlarge
                - c6i.2xlarge
                - c6id.2xlarge
                - c6in.2xlarge
                - c7i.2xlarge
                - m5.2xlarge
                - m5d.2xlarge
                - m5zn.2xlarge
                - m6i.2xlarge
                - m6id.2xlarge
                - m6idn.2xlarge
                - m6in.2xlarge
                - m7i.2xlarge
                - r5.2xlarge
                - r5b.2xlarge
                - r5d.2xlarge
                - r5dn.2xlarge
                - r5n.2xlarge
                - r6id.2xlarge
                - r6idn.2xlarge
                - r6in.2xlarge
                - r7i.2xlarge

# ---- Service ----
service:
  type: ClusterIP
  port: 80
  containerPort: 8080

# ---- Ingress via ALB (EKS Auto Mode) ----
ingress:
  enabled: true
  class: alb
  host: ""   # No host header match — ALB routes all requests for any host
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "9"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "10"
    alb.ingress.kubernetes.io/success-codes: "200-302"
    alb.ingress.kubernetes.io/load-balancer-name: open-webui-ingress

# ---- EKS Auto Mode IngressClass + IngressClassParams ----
# The chart renders these as extra manifests alongside the main resources
extraResources:
  - apiVersion: eks.amazonaws.com/v1
    kind: IngressClassParams
    metadata:
      name: alb
    spec:
      scheme: internet-facing
  - apiVersion: networking.k8s.io/v1
    kind: IngressClass
    metadata:
      name: alb
      labels:
        app.kubernetes.io/name: LoadBalancerController
      annotations:
        ingressclass.kubernetes.io/is-default-class: "true"
    spec:
      controller: eks.amazonaws.com/alb
      parameters:
        apiGroup: eks.amazonaws.com
        kind: IngressClassParams
        name: alb
