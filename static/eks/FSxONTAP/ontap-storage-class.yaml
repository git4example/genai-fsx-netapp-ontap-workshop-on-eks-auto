# ontap-storage-class.yaml
#
# FSx for NetApp ONTAP's NFS endpoint is reachable from every Availability Zone,
# so Trident advertises no zone topology (topologyKeys: null). With
# volumeBindingMode: Immediate the CSI external-provisioner needs an explicit
# zone list to satisfy its accessibility requirement. Without allowedTopologies
# it fails with "error generating accessibility requirements: no available
# topology found". We keep Immediate (WaitForFirstConsumer would leave the
# no-pod import PVCs Pending forever) and supply the zone list below.
#
# AZ_LIST_JSON is substituted at apply time from the region the workshop was
# actually deployed into, so this manifest is region-agnostic:
#
#   export AZ_LIST_JSON=$(aws ec2 describe-availability-zones --region $AWS_REGION \
#     --query "AvailabilityZones[?State=='available'].ZoneName" --output json | tr -d ' \n')
#   envsubst '$AZ_LIST_JSON' < ontap-storage-class.yaml | kubectl apply -f -
#
# It expands to a YAML flow sequence, e.g. values: ["us-west-2a","us-west-2b"].
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-nas-sc
provisioner: csi.trident.netapp.io
reclaimPolicy: Retain
parameters:
  backendType: "ontap-nas"
  provisioningType: "thin"
  snapshots: "true"
allowVolumeExpansion: true
volumeBindingMode: Immediate
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/zone
        values: ${AZ_LIST_JSON}
mountOptions:
  - nfsvers=4.1
