# netshoot-model.yaml — mounts the model volume for inspection.
#
# Apply it, wait for it, read the logs:
#   kubectl apply -f netshoot-model.yaml
#   kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/netshoot-model --timeout=300s
#   kubectl logs netshoot-model
#   kubectl delete -f netshoot-model.yaml
#
# On EKS Auto Mode the cluster scales worker nodes to zero, so the first pod you
# schedule waits 1-2 minutes for a node to be provisioned. That is why this is a
# manifest you wait on rather than an interactive `kubectl run --rm -it`, which
# times out on the TTY and then deletes the pod along with the diagnostics.
apiVersion: v1
kind: Pod
metadata:
  name: netshoot-model
  namespace: default
  labels:
    app: netshoot-model
spec:
  restartPolicy: Never
  containers:
    - name: netshoot
      image: nicolaka/netshoot
      command:
        - sh
        - -c
        - |
          echo "--- NFS mount source (should be the ONTAP volume backing the PVC) ---"
          mount | grep /model-vol
          echo
          echo "--- capacity ---"
          df -h /model-vol
          echo
          echo "--- model directory ---"
          ls -la /model-vol/Mistral-7B-Instruct-v0.3/ 2>/dev/null || echo "MODEL DIR NOT FOUND"
          echo
          echo "--- total size (expect ~27 GiB) ---"
          du -sh /model-vol/Mistral-7B-Instruct-v0.3/ 2>/dev/null
          echo
          echo "--- required vLLM artifacts ---"
          for f in config.json neuron_config.json model.pt \
                   model.safetensors.index.json tokenizer.json \
                   model-00001-of-00003.safetensors; do
            if [ -f "/model-vol/Mistral-7B-Instruct-v0.3/$f" ]; then
              echo "  OK      $f"
            else
              echo "  MISSING $f"
            fi
          done
      volumeMounts:
        - name: model
          mountPath: /model-vol
  volumes:
    - name: model
      persistentVolumeClaim:
        claimName: ontap-model-claim
