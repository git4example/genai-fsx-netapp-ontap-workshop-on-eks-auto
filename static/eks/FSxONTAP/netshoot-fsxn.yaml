# netshoot-fsxn.yaml — general-purpose utility pod with the model volume mounted
# at /work-dir. Used throughout the workshop to inspect the FSx for ONTAP volume,
# view snapshots, and query the agent endpoints (it has curl and jq).
#
#   kubectl apply -f netshoot-fsxn.yaml
#   kubectl wait --for=condition=Ready pod/netshoot-fsxn --timeout=300s
#   kubectl exec -it netshoot-fsxn -- bash
#   kubectl delete -f netshoot-fsxn.yaml
#
# The containers sleep so the pod stays available to exec into. On EKS Auto Mode
# the cluster scales worker nodes to zero, so the first pod scheduled waits 1-2
# minutes for a node -- hence the 300s wait rather than 120s.
#
# NOTE: this pod lives in the `default` namespace and mounts ontap-model-claim.
# The agent data volume (agent-shared-data) is in the `agents` namespace, and a
# pod can only reference PVCs in its own namespace, so agent data is inspected
# from within the agent pods themselves.
apiVersion: v1
kind: Pod
metadata:
  name: netshoot-fsxn
  namespace: default
spec:
  containers:
  - name: netshoot
    image: nicolaka/netshoot
    command: ["sh", "-c", "sleep infinity"]
    volumeMounts:
    - name: persistent-storage
      mountPath: /work-dir
  - name: hf-cli
    image: public.ecr.aws/parikshit/huggingface-cli@sha256:1b36b33204ac8e8b2868c98434d65a137a5df969563d432bb7b2197a9f48f675
    command: ["sh", "-c", "sleep infinity"]
    env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: token
          optional: true
    volumeMounts:
    - name: persistent-storage
      mountPath: /work-dir
  - name: s5cmd
    image: public.ecr.aws/parikshit/s5cmd@sha256:235f72ce7c3971142aefd945e0da0b61079a0f44725181877bdf653d001cfe59
    command: ["sh", "-c", "sleep infinity"]
    volumeMounts:
      - name: persistent-storage
        mountPath: /work-dir
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ontap-model-claim
  restartPolicy: Never
  tolerations:
  - key: aws.amazon.com/neuron
    operator: Exists
    effect: NoSchedule
