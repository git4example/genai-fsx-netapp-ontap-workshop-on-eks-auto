apiVersion: v1
kind: PersistentVolume
metadata:
  name: finance-agent-pv
  labels:
    agent: finance
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadOnlyMany
  nfs:
    server: "${FSXN_NFS_IP}"
    path: "/finance_data"
  mountOptions:
    - nfsvers=4.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finance-agent-data-claim
  namespace: agent-finance
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: finance-agent-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-agent
  namespace: agent-finance
  labels:
    app: finance-agent
    team: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-agent
  template:
    metadata:
      labels:
        app: finance-agent
        team: finance
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: agent
        image: "${AGENT_IMAGE}"
        env:
        - name: AGENT_ROLE
          value: "Finance Team AI Assistant — you help analysts with financial reports, transactions, budgets, and compliance documents"
        - name: DATA_DIR
          value: "/data"
        - name: LLM_ENDPOINT
          value: "http://vllm-mistral7b-service.default.svc.cluster.local:8000/v1"
        volumeMounts:
        - name: finance-data
          mountPath: "/data"
          readOnly: true
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: finance-data
        persistentVolumeClaim:
          claimName: finance-agent-data-claim
---
apiVersion: v1
kind: Service
metadata:
  name: finance-agent-svc
  namespace: agent-finance
spec:
  selector:
    app: finance-agent
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
