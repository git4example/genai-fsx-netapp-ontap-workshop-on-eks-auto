apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-agent
  namespace: agent-finance
  labels:
    app: finance-agent
    team: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-agent
  template:
    metadata:
      labels:
        app: finance-agent
        team: finance
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: agent
        image: "${AGENT_IMAGE}"
        env:
        - name: AGENT_ROLE
          value: "Finance Team AI Assistant — you help analysts with financial reports, transactions, budgets, and compliance documents"
        - name: DATA_DIR
          value: "/data"
        - name: LLM_ENDPOINT
          value: "http://litellm-service.default.svc.cluster.local:4000/v1"
        - name: LLM_MODEL_ID
          value: "workshop-llm-tools"
        - name: LLM_API_KEY
          value: "not-needed"
        volumeMounts:
        - name: finance-data
          mountPath: "/data"
          readOnly: true
        command: ["python", "agent.py", "--serve"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: finance-data
        persistentVolumeClaim:
          claimName: finance-agent-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: finance-agent-svc
  namespace: agent-finance
spec:
  selector:
    app: finance-agent
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
