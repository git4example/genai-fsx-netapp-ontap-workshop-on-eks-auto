apiVersion: batch/v1
kind: Job
metadata:
  name: set-finance-permissions
  namespace: agent-finance
spec:
  template:
    spec:
      containers:
      - name: permission-setter
        image: public.ecr.aws/amazonlinux/amazonlinux:2023
        command:
        - /bin/bash
        - -c
        - |
          echo "Setting permissions on /data (finance volume)..."
          chown -R 1001:1001 /data
          chmod -R 750 /data
          echo "  chown -R 1001:1001 /data"
          echo "  chmod -R 750 /data"
          echo "  Verified: only UID 1001 (finance agent) can read"
          echo ""
          echo "Permission setup complete: owner=1001, group=1001, mode=750"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: finance-vol
          mountPath: /data
      volumes:
      - name: finance-vol
        persistentVolumeClaim:
          claimName: finance-agent-data-pvc
      restartPolicy: Never
  backoffLimit: 2
---
