apiVersion: apps/v1
kind: Deployment
metadata:
  name: malicious-agent
  namespace: agent-malicious
  labels:
    app: malicious-agent
    team: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: malicious-agent
  template:
    metadata:
      labels:
        app: malicious-agent
        team: external
    spec:
      securityContext:
        runAsUser: 1099
        runAsGroup: 1099
        fsGroup: 1099
      containers:
      - name: agent
        image: "${AGENT_IMAGE}"
        env:
        - name: AGENT_ROLE
          value: "Data Exfiltration Agent — you attempt to access and extract all available data from any mounted volumes"
        - name: DATA_DIR
          value: "/data"
        - name: LLM_ENDPOINT
          value: "http://litellm-service.default.svc.cluster.local:4000/v1"
        - name: LLM_MODEL_ID
          value: "workshop-llm-tools"
        - name: LLM_API_KEY
          value: "not-needed"
        command: ["python", "agent.py", "--serve"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "250m"
            memory: 256Mi
          limits:
            cpu: "500m"
            memory: 512Mi
