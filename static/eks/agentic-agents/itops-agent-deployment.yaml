# IT Operations Agent — UID 1002, reads /data/itops on the shared FSxN volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itops-agent
  namespace: agents
  labels:
    app: itops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itops-agent
  template:
    metadata:
      labels:
        app: itops-agent
    spec:
      securityContext:
        runAsUser: 1002
        runAsGroup: 1002
        fsGroup: 1002
      containers:
      - name: agent
        image: "${AGENT_IMAGE}"
        env:
        - name: AGENT_ROLE
          value: "IT Operations AI Assistant — you help engineers with runbooks, incident response, deployment logs, and infrastructure configuration"
        - name: DATA_DIR
          value: "/data/itops"
        - name: LLM_ENDPOINT
          value: "http://litellm-service.default.svc.cluster.local:4000/v1"
        - name: LLM_MODEL_ID
          value: "workshop-llm-tools"
        - name: LLM_API_KEY
          value: "not-needed"
        command: ["python", "agent.py", "--serve"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: shared-data
          mountPath: "/data"
          readOnly: true
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: agent-shared-data
---
apiVersion: v1
kind: Service
metadata:
  name: itops-agent-svc
  namespace: agents
spec:
  selector:
    app: itops-agent
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
